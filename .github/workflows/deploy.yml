name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Resolve D1 database ID
        id: d1
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="benchmarks") | .uuid // .id' | head -1)
          if [ -z "$DB_ID" ]; then
            DB_ID=$(npx wrangler d1 create benchmarks --json | jq -r '.uuid // .id')
          fi
          echo "db_id=$DB_ID" >> "$GITHUB_OUTPUT"

      - name: Patch wrangler.jsonc with real D1 database ID
        run: |
          sed -i 's/YOUR_D1_ID/${{ steps.d1.outputs.db_id }}/g' wrangler.jsonc

      - name: Set CF_ACCOUNT_ID wrangler secret
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" | npx wrangler secret put CF_ACCOUNT_ID

      # CF_API_TOKEN is the name used by the worker's Env interface (src/api/index.ts).
      # Its value is sourced from CLOUDFLARE_API_KEY (the account's global API key).
      - name: Set CF_API_TOKEN wrangler secret
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "${{ secrets.CLOUDFLARE_API_KEY }}" | npx wrangler secret put CF_API_TOKEN

      - name: Deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
